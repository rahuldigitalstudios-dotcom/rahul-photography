<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rahul Photography</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:black;
      color:white;
    }

    .hero{
      height:100vh;
      background:url('https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1400&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      position:relative;
    }

    .overlay{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.7);
    }

    .content{
      position:relative;
      z-index:2;
      padding:20px;
    }

    h1{
      font-size:80px;
      font-family:cursive;
      margin-bottom:20px;
    }

    .subtitle{
      letter-spacing:4px;
      color:#ccc;
      margin-bottom:20px;
    }

    .tagline{
      font-size:35px;
      margin-bottom:20px;
    }

    .desc{
      color:#bbb;
      max-width:700px;
      margin:auto;
      line-height:1.7;
    }

    .buttons{
      margin-top:40px;
    }

    .buttons a{
      display:inline-block;
      margin:10px;
      padding:14px 28px;
      border-radius:10px;
      text-decoration:none;
      font-weight:bold;
    }

    .insta{
      background:white;
      color:black;
    }

    .youtube{
      border:1px solid white;
      color:white;
    }

    .whatsapp{
      background:#25D366;
      color:white;
    }

    .section{
      padding:80px 20px;
      text-align:center;
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:20px;
      margin-top:40px;
    }

    .gallery img{
      width:100%;
      height:400px;
      object-fit:cover;
      border-radius:20px;
    }

    footer{
      text-align:center;
      padding:30px;
      border-top:1px solid #333;
      color:#888;
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="overlay"></div>

    <div class="content">
      <h1>Rahul Photography</h1>

      <div class="subtitle">
        WEDDING PHOTOGRAPHER IN JAMMU
      </div>

      <div class="tagline">
        Cinematic Wedding Stories
      </div>

      <p class="desc">
        Capturing emotions, love & timeless memories through every frame.
      </p>

      <div class="buttons">
        <a class="insta" href="https://www.instagram.com/cinevows_bychoudhary/" target="_blank">
          Instagram
        </a>

        <a class="youtube" href="https://www.youtube.com/channel/UCYrkHAIrTNv-Q-vLDTNGCYw" target="_blank">
          YouTube
        </a>

        <a class="whatsapp" href="https://wa.me/919622227082" target="_blank">
          WhatsApp
        </a>
      </div>
    </div>
  </section>

  <section class="section">
    <h2>Featured Gallery</h2>

    <div class="gallery">
      <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=1200&auto=format&fit=crop">
      <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?q=80&w=1200&auto=format&fit=crop">
      <img src="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1200&auto=format&fit=crop">
      <img src="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?q=80&w=1200&auto=format&fit=crop">
    </div>
  </section>

  <footer>
    © 2026 Rahul Photography — All Rights Reserved.
  </footer>

</body>
</html>
